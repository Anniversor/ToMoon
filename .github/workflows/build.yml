name: ToMoon Auto Build

on:
  - push
  - pull_request

permissions:
  contents: write

jobs:
  build_plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      #build tomoon start
      - uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip upx

      - name: Download Clash and Yacd and Subconverter
        run: |
          mkdir tmp && cd tmp
          mkdir core && cd core
          # Mihomo (Clash Meta) — derive the latest tag from the
          # /releases/latest redirect (no api.github.com call, so the
          # runner's shared IP can't get rate-limited), then download
          # the canonical baseline asset mihomo-linux-amd64-vX.Y.Z.gz.
          # Upstream now also ships v1/v2/v3 GOAMD64 micro-arch and
          # go120/go123 toolchain variants whose names start the same
          # way, so we must match on the exact -vX.Y.Z.gz suffix.
          LATEST_TAG=$(curl -sI https://github.com/MetaCubeX/mihomo/releases/latest \
            | awk 'tolower($1)=="location:"{print $2}' \
            | sed -E 's|.*/tag/(v[0-9.]+).*|\1|' \
            | tr -d '\r\n')
          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to resolve mihomo latest tag" >&2
            exit 1
          fi
          LATEST_URL="https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz"
          echo "Downloading mihomo from: $LATEST_URL"
          wget -O clash.gz "$LATEST_URL"
          gzip -d clash.gz

          # upx
          chmod +x clash
          upx clash

          # country.mmdb & geosite.dat
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
          wget https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
          wget -O asn.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-ASN.mmdb
          
          # dashboard
          mkdir web
          # yacd
          wget -O yacd.zip https://github.com/haishanh/yacd/archive/refs/heads/gh-pages.zip
          unzip yacd.zip
          mv yacd-gh-pages web/yacd
          # yacd-meta
          wget -O yacd-meta.zip https://github.com/MetaCubeX/yacd/archive/gh-pages.zip
          unzip yacd-meta.zip
          mv Yacd-meta-gh-pages web/yacd-meta
          # metacubexd
          wget -O metacubexd.zip https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
          unzip metacubexd.zip
          mv metacubexd-gh-pages web/metacubexd
          # zashboard
          wget -O zashboard.zip https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
          unzip zashboard.zip
          mv dist web/zashboard

          echo "clean zips"
          rm -f *.zip

          cd $GITHUB_WORKSPACE
          # Upstream removed the rolling "Alpha" tag; use the
          # /releases/latest/download/ redirect so this always pulls
          # whatever the current stable subconverter release is.
          wget -O subconverter_linux64.tar.gz https://github.com/MetaCubeX/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar xvf subconverter_linux64.tar.gz

          # upx
          chmod +x subconverter/subconverter
          upx subconverter/subconverter

      # build front-end start
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Requestment
        run: |
          cp -r usdpl src/
          npm i
      - name: build front end
        run: npm run build
        working-directory: .
      - name: build external web page
        run: |
          npm i
          npm run build
        working-directory: tomoon-web
      # build front-end end
      # build backend start
      - uses: dtolnay/rust-toolchain@stable
      - uses: ClementTsang/cargo-action@v0.0.6
        with:
          command: build
          directory: ./backend
          args: --target x86_64-unknown-linux-gnu --release
          use-cross: false

      - name: upx tomoon
        run: |
          upx ./backend/target/x86_64-unknown-linux-gnu/release/tomoon

      - name: Collect Files
        run: |
          mkdir -p ./release/tomoon/bin/core/web
          mkdir -p ./release/tomoon/dist
          cp backend/target/x86_64-unknown-linux-gnu/release/tomoon ./release/tomoon/bin/tomoon
          cp ./dist/index.js ./release/tomoon/dist/index.js
          cp main.py ./release/tomoon/main.py
          cp plugin.json ./release/tomoon/plugin.json
          cp package.json ./release/tomoon/package.json
          cp -r ./tmp/core ./release/tomoon/bin/
          cp -r ./tomoon-web/dist ./release/tomoon/web
          cp -r ./py_modules ./release/tomoon/py_modules
          mkdir -p ./release/tomoon/web/rules
          bash ./assets/subconverter_rules/dl_rules.sh ./release/tomoon/web/rules
          cp ./assets/subconverter_rules/ACL4SSR_Online.ini ./release/tomoon/web/ACL4SSR_Online.ini
          cp ./subconverter/subconverter ./release/tomoon/bin/subconverter
          cd ./release 
          zip -r tomoon.zip tomoon
          cd ..

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tomoon-artifacts
          path: ./release/tomoon.zip
          if-no-files-found: error


  publish:
    name: Publish Release
    # Normal path: publish on v* tag push.
    # Preview path: also publish when the claude/dns-per-domain-config-D72P1
    # branch is pushed, so testers can install the artifact from a GitHub
    # Release without waiting for a version bump. Revert this branch clause
    # before merging to the default branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/claude/dns-per-domain-config-D72P1'
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - run: mkdir /tmp/artifacts

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - run: ls -R /tmp/artifacts

      - name: compute release name
        id: relname
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME}"
          else
            NAME="v0.2.9-dns-policy-preview"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          mv /tmp/artifacts/tomoon-artifacts/tomoon.zip "/tmp/artifacts/tomoon-artifacts/tomoon-${NAME}.zip"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/tomoon-artifacts/tomoon*.zip
          name: Release ${{ steps.relname.outputs.name }}
          tag_name: ${{ steps.relname.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(steps.relname.outputs.name, 'pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}